{{- if .Values.mcpGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onyx.resourceName" (list . "mcp-gateway") }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    {{- with .Values.mcpGateway.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.mcpGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      {{- if .Values.mcpGateway.deploymentLabels }}
      {{- toYaml .Values.mcpGateway.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.mcpGateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "onyx.labels" . | nindent 8 }}
        {{- with .Values.mcpGateway.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.mcpGateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "onyx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.mcpGateway.podSecurityContext | nindent 8 }}
      {{- with .Values.mcpGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-gateway
          securityContext:
            {{- toYaml .Values.mcpGateway.securityContext | nindent 12 }}
          image: "{{ .Values.mcpGateway.image.repository }}:{{ .Values.mcpGateway.image.tag | default .Values.global.version }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          command: [{{ include "onyx.customCACerts.commandPrefix" . }}"python", "-m", "onyx.mcp_gateway_main"]
          ports:
            - name: mcp-gateway-port
              containerPort: {{ .Values.mcpGateway.containerPorts.server }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: mcp-gateway-port
            initialDelaySeconds: {{ .Values.mcpGateway.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcpGateway.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mcpGateway.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.mcpGateway.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: mcp-gateway-port
            initialDelaySeconds: {{ .Values.mcpGateway.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcpGateway.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mcpGateway.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.mcpGateway.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.mcpGateway.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.envConfigMapName }}
            {{- with .Values.extraEnvFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: MCP_GATEWAY_ENABLED
              value: "true"
            - name: MCP_GATEWAY_PORT
              value: "{{ .Values.mcpGateway.containerPorts.server }}"
            - name: MCP_GATEWAY_HOST
              value: "0.0.0.0"
            - name: MCP_GATEWAY_PUBLIC_URL
              value: "http://{{ include "onyx.resourceName" (list . "mcp-gateway-service") }}:{{ .Values.mcpGateway.service.servicePort }}"
            {{- include "onyx.envSecrets" . | nindent 12 }}
            {{- include "onyx.metricsAuthEnv" . | nindent 12 }}
            {{- with include "onyx.customCACerts.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.mcpGateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with include "onyx.volumeMountsWithCA" (dict "ctx" . "volumeMounts" .Values.mcpGateway.volumeMounts) }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- with include "onyx.volumesWithCA" (dict "ctx" . "volumes" .Values.mcpGateway.volumes) }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
