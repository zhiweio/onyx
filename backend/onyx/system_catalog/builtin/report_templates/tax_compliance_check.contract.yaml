# 税务合规体检报告 · 内容契约
#
# 契约约束"报告必须为真、必须包含",不约束章节排布与版式。
# 字段说明见 onyx/report_templates/contract.py。

must_answer:
  - 体检主体、期间与税种范围是什么?
  - 五块自检各自的评级与证据是什么?
  - 红旗项的管理层解释或待核验事项有哪些?
  - 整改清单(动作、责任角色、时限)是什么?
  - 结论与非审计意见边界如何声明?

required_elements:
  - sources
  - data_gaps
  - disclaimer
  - 五块评级
  - 红旗清单
  - 整改清单

spine:
  - 范围与口径
  - 五块体检
  - 红旗与解释
  - 整改与结论

components:
  - kpi
  - callout
  - table
  - figure
  - toc

hard_rules:
  - 评级必须挂证据行;证据不足标「待核验」,不凭感觉定级。
  - 每个数字、每条发现可溯源:原始来源名称(注明数据项)、政策文号+条款,或网页 URL 与访问日期。
  - 报告正文不出现 MCP 工具名、服务器名、outputs/ 等内部路径、/tmp/ 等临时路径与脚本名。
  - 拿不到的数据写「未获取」并写原因;转述标「转述」。
  - 图注统一「图表N + 标题 + 来源行」;不留草稿、待修改、TODO 等未定稿标记。
  - 免责声明与「非审计意见」边界保留在报告末尾。

completion_criteria:
  - 无残留 {{占位符}},无草稿/待修改/TODO 等未定稿标记。
  - 目录域存在,章号连续。
  - 图表不少于 5 张(税负对比、申报与账面差异、评级汇总、红旗分布、整改时间线为基线)。
  - 每张表/图下有来源行。
  - 免责声明保留在报告末尾。

forbidden_patterns:
  - '\b(?:qcc|patsnap|hithink)-[\w-]+'
  - '\bcompany-(?:credit|profile|risk)\b'
  - '\bMCP\b'
  - '\b(?:TODO|FIXME)\b'

min_figures: 5
require_toc: true
require_disclaimer: true
