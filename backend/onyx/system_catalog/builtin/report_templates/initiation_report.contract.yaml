# 契约式模板内容契约。字段说明见 onyx/report_templates/contract.py
must_answer:
- 资产与适应症是什么,当前处于什么阶段?
- 本次要回答 go/hold/no-go 中的哪一个,决策日期是何时?
- 每个决策因子的证据与打分是什么?
- 主要风险与未决问题有哪些?
- 最终建议与前置条件是什么?
required_elements:
- sources
- data_gaps
- disclaimer
- 证据表
- 决策因子打分
- 发现表
spine:
- 资产与决策问题
- 证据与打分
- 风险与未决
- 结论与前置条件
components:
- kpi
- callout
- table
- figure
- toc
hard_rules:
- 每个决策因子都有引用(文献号/试验登记号/专利号);无引用不打分。
- 每个数字、每条发现可溯源:原始来源名称或网页 URL 与访问日期。
- 报告正文不出现 MCP 工具名、服务器名、outputs/ 等内部路径与脚本名。
- 拿不到的数据写「未获取」并写原因;转述标「转述」。
completion_criteria:
- 无残留 {{占位符}},无草稿/待修改/TODO 等未定稿标记。
- 章号连续,标题按内容自拟。
- 每个决策因子有引用;发现表无空行。
- 图表不少于 5 张(竞争格局、打分对比、读出时间为基线,可按证据增补管线对比、风险矩阵等),图注统一「图表N + 标题 + 来源行」。
min_figures: 5
require_toc: true
require_disclaimer: true
