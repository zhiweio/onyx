# 财税与经营风险分析报告 · 内容契约
#
# 契约约束"报告必须为真、必须包含",不约束章节排布与版式——结构由软脊柱
# 引导、由 LLM 依证据组织,版式由 theme + 渲染器统一保证。
# required_elements 使用渲染器 postcheck 认识的规范键(见
# onyx/report_templates/contract.py),额外自由条目仅作写作指引。

must_answer:
  - 五年里哪些指标在变好,哪些在恶化?
  - 利润是不是真的?现金能不能验证利润?
  - 税交得对不对、稳不稳?优惠能不能持续?
  - 钱花在哪了,还够不够?债扛不扛得住?
  - 哪些风险必须马上处理,哪些只需持续监控?
  - 下一步 30 天、90 天做什么?

required_elements:
  - kpi_dashboard
  - sources
  - risk_matrix
  - remediation
  - subsequent_events
  - data_gaps
  - disclaimer

# 软脊柱:四幕叙事弧线。章节可在幕内增删、合并、重命名、自定子结构;
# 公司特有事件(定增终止、商誉高企、审计机构更换等)应增设专题章。
spine:
  - 总览(执行摘要 + 核心看板)
  - 数据与趋势(三表透视 + 专项分析)
  - 风险(识别 + 矩阵 + 专题)
  - 建议与结论(整改 + 期后 + 免责)

components:
  - kpi
  - callout
  - table
  - figure
  - toc

hard_rules:
  - 每个数字可溯源:年报页码、原始来源名称(企查查/智慧芽/同花顺,注明数据项),或网页 URL,三选一。
  - 报告正文不出现 MCP 工具名、服务器名(qcc-*、hithink-* 等)、outputs/ 等内部路径与脚本名。
  - 跨年比较先检查会计政策变更;口径变化要写明,不可机械横比。
  - 期后事项(未审计数据)单独成章,标注「未经审计,仅作趋势观察」,不并入五年表。
  - 风险编号沿用 TX-xx(财税)/ OP-xx(经营)命名约定,条数由证据决定(财税约 4~10 条,经营约 3~8 条)。
  - 风险等级只有高/中/低,评分映射 56/20/4,不发明新等级。
  - 结论必须闭环:收入 → 扣非利润 → 现金流 → 资产回报 → 内控覆盖,逐条回答。

completion_criteria:
  - 无残留 {{占位符}}。
  - 目录域存在,章号连续。
  - 图表不少于 5 张(营收利润趋势、盈利能力、利润与现金流对比、费用结构、风险热力图为基线,可按证据增补)。
  - 每张表/图下有来源行。
  - 免责声明保留在报告末尾。

min_figures: 5
require_toc: true
require_disclaimer: true
