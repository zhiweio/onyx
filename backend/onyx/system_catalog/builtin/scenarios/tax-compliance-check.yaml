domain: tax
objective: Run a tax compliance health check on one entity — declaration consistency, tax-burden reasonableness, internal-control effectiveness, fraud red flags and preferential-policy readiness — and deliver a report (platform-rendered Word) with ratings and a remediation list.
required_inputs:
  - entity (company name; ticker or 统一社会信用代码 when available)
  - review period
  - financial statements or trial balance for the period (uploads or MCP capture)
phases:
  - id: scope
    done_when: outputs/analysis/scope.json fixes the entity, period, tax types in play, and evidence boundaries
  - id: collect
    done_when: Statements plus public penalties, litigation and industry context (企查查 / 同花顺 captures or web with access dates) sit under outputs/analysis with per-source manifests
  - id: test
    done_when: The five self-check blocks from regulatory-alerts.md each carry a 健康/关注/预警 rating with evidence rows
  - id: redflags
    done_when: fraud-red-flags.md items are scanned item by item; every hit lists evidence and the management explanation or an open question
  - id: charts
    done_when: outputs/charts holds at least five charts (tax-burden vs peers, declaration-vs-book gaps, five-block rating summary, red-flag distribution, remediation timeline), drawn with vivid-figures-skill first
  - id: report
    done_when: outputs/report.md follows the tax_compliance_check contract (must-answer, required elements, spine) with continuous chapter numbers
  - id: qa
    done_when: the check_report platform tool passes every check on outputs/report.md; ratings name their evidence, cited policies carry document numbers, and no placeholders survive
deliverables:
  - outputs/report.md
  - outputs/analysis/selfcheck.json
quality_gates:
  - Ratings cite evidence rows, never gut feeling; insufficient evidence marks 待核验
  - Audience-facing report stays free of tool names, skill names and internal or temp paths (outputs/, .opencode/, /tmp/), and free of MCP tool and server names
  - Charts use selfcheck.json numbers only, one period and accounting basis noted per chart; every table and figure carries a numbered caption with a source line
  - No leftover {{placeholders}} and no draft markers (草稿 / 待修改 / TODO) in the report
  - The disclaimer and "not an audit opinion" boundary survive in the delivered report
  - check_report passes every check before delivery; the platform renders the formal Word at export
refusal_rules:
  - Do not invent a penalty record, case number or policy citation
  - Do not present the health check as an audit opinion or tax filing position
  - Do not recommend arrangements that conceal violations; flag them as risk instead
