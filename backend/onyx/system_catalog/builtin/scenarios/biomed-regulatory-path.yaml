domain: biomed
objective: Name the filing path and the evidence still missing for each market
required_inputs:
  - product
  - markets
  - current_stage
phases:
  - id: route
    done_when: Each market has a named path and a current stage
  - id: evidence
    done_when: Required packages are listed against what exists
  - id: report
    done_when: outputs/report.docx is filled
deliverables:
  - outputs/report.docx
quality_gates:
  - Gaps name the study or module that is missing
  - Communication milestones are dated or marked unknown
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent meeting minutes or agency advice
  - Do not copy another product's path without stating the difference
