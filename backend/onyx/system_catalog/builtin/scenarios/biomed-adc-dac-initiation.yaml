domain: biomed
objective: Reach a cited go / conditional-go / no-go for one ADC or DAC program
required_inputs:
  - target
  - modality
  - payload
  - indication
  - decision_date
suggested_lanes:
  - role: literature
    skill_id: biomed-literature
  - role: clinical
    skill_id: biomed-clinical-intel
  - role: patent
    skill_id: biomed-patent-fto
  - role: adc-dac
    skill_id: biomed-adc-dac-initiation
phases:
  - id: collect
    done_when: Public papers, trials, patents, and sequences are listed with identifiers
  - id: freeze
    done_when: Source, sequence, and assay ledgers are filled
  - id: report
    done_when: outputs/markdown/adc-dac-initiation-report.md states a decision
deliverables:
  - outputs/markdown/adc-dac-initiation-report.md
  - outputs/normalized/sources.csv
  - outputs/normalized/sequences.csv
  - outputs/normalized/assays.csv
quality_gates:
  - Every material claim has a fetched identifier
  - Sequence cluster is not written as an epitope or FTO conclusion
  - Public facts come from the installed search MCP and public databases only
refusal_rules:
  - Do not invent sequences, PMIDs, NCT IDs, or patent numbers
  - Do not fill missing listings from model memory
  - Do not give a legal FTO opinion
