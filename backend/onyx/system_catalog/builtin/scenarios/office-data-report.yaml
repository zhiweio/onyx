domain: office
objective: Turn a table into conclusions a reader can check against the file
required_inputs:
  - question
  - data_file
  - period
phases:
  - id: inspect
    done_when: Grain, missing values, and units are recorded
  - id: analyze
    done_when: Each finding names the metric and the filter
  - id: report
    done_when: outputs/report.docx is filled
deliverables:
  - outputs/report.docx
  - outputs/normalized/findings.csv
quality_gates:
  - Totals can be recomputed from the source file
  - Quality issues are listed before conclusions
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent rows
  - Do not hide a filter that changes the total
