domain: tax
objective: Present a tax-risk health check as a management deck — TX/OP risk matrix, top findings with evidence, scores and a remediation plan — delivered as a Slidev deck with a self-contained offline.html; the Word report twin is the finance-tax-risk-report scenario.
required_inputs:
  - entity
  - annual reports or financial statements for the review period
phases:
  - id: resolve
    done_when: outputs/entity.json names one official entity with ticker or 统一社会信用代码
  - id: collect
    done_when: Annual reports plus public tax and administrative penalties (企查查 / 同花顺 captures or web) are stored under outputs/analysis with per-source manifests
  - id: risks
    done_when: TX-01~TX-10 and OP-01~OP-08 entries are scored in evidence-cause-impact form under outputs/analysis/risk_matrix.json
  - id: charts
    done_when: outputs/analysis/chart_plan.json plans at least five figures — the risk-matrix heatmap plus tax-burden trend, tax-type structure, profit/cash-flow trend and a remediation timeline — with data sources and slideblocks render routes
  - id: deck
    done_when: outputs/slides holds the management deck (top risks, matrix, remediation timeline) with a verified self-contained offline.html; every planned figure is drawn inside the deck with its locked slideblocks render route
  - id: qa
    done_when: Every risk score traces to evidence rows and no placeholders survive
deliverables:
  - outputs/slides/offline.html
  - outputs/slides/slides.md
  - outputs/analysis/risk_matrix.json
quality_gates:
  - Each risk names its evidence in reader-facing form (report page, penalty number, or URL with access date)
  - Audience-facing slides stay free of tool names, skill names and internal or temp paths
  - TX/OP risk IDs run continuously from 01 — no gaps, no duplicates
  - Remediation actions carry owner-by-role, deadline and priority
  - Every chart and diagram is drawn inside the deck with a slideblocks render route (diagram:mermaid, figure:comparison, figure:annotated, figure:graph, diagram:elk, or direct-svg); no chart arrives as an image produced by another skill or an external plotting tool
  - No leftover {{placeholders}} and no draft markers (草稿 / 待修改 / TODO) on slides
refusal_rules:
  - Do not invent a ticker, 统一社会信用代码 or 案号
  - Do not present unaudited data as audited
  - Do not score risks outside the TX/OP framework mapping
