domain: office
objective: Turn notes into minutes with owners and dates
required_inputs:
  - meeting_title
  - meeting_date
  - notes
phases:
  - id: extract
    done_when: Decisions and actions are separated from discussion
  - id: assign
    done_when: Every action has an owner or is marked unspecified
  - id: report
    done_when: outputs/report.docx is filled
deliverables:
  - outputs/report.docx
quality_gates:
  - Decisions do not include discussion
  - Missing owners are written as 未指定
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent attendees or decisions
  - Do not drop a disagreement
