domain: office
objective: Turn a brief into a slide outline, then a deck
required_inputs:
  - topic
  - audience
  - source_brief
phases:
  - id: outline
    done_when: outputs/report.docx lists one message per slide
  - id: build
    done_when: outputs/deck.pptx follows the outline order
  - id: qa
    done_when: Every slide has a title and a single message
deliverables:
  - outputs/report.docx
  - outputs/deck.pptx
quality_gates:
  - The Word outline is filled before the deck is built
  - No leftover {{placeholders}} in the Word file
  - Slide count matches the outline
refusal_rules:
  - Do not invent figures that are not in the brief
  - Do not skip the outline and draft slides from memory
