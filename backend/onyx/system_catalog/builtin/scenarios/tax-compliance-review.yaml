domain: tax
objective: Produce a cited tax-compliance risk brief for one entity
required_inputs:
  - entity
  - tax_id
  - period
phases:
  - id: scope
    done_when: Entity, tax ID, industry, and region are recorded
  - id: search
    done_when: Official, judicial, and configured commercial sources are queried
  - id: grade
    done_when: Every finding has a source, date, and severity
  - id: report
    done_when: outputs/report.docx is filled with every required token
deliverables:
  - outputs/report.docx
  - outputs/normalized/findings.csv
quality_gates:
  - Every material claim has a URL and a date when the source has one
  - Unavailable sources are listed, not guessed
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent 文号, 案号, or penalties
  - Do not present commercial results as official filings
