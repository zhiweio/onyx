domain: biomed
objective: Map target mechanism and competing assets with graded evidence
required_inputs:
  - target
  - indication
phases:
  - id: collect
    done_when: Key papers and registered assets are listed
  - id: grade
    done_when: Each claim has an evidence grade
  - id: report
    done_when: outputs/report.docx is filled
deliverables:
  - outputs/report.docx
quality_gates:
  - Competing assets name modality, stage, and sponsor when known
  - Conflicts between sources are stated, not averaged
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent a mechanism or a competitor
  - Do not cite a review in place of the underlying study when the study is available
