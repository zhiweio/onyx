domain: listed-company
objective: Produce an evidence-bound five-year finance-tax-operation risk report
required_inputs:
  - entity
  - period_years
  - currency
phases:
  - id: resolve
    done_when: outputs/entity.json names one official entity with ticker
  - id: collect
    done_when: Five annual reports (or equivalent) are extracted under outputs/analysis with per-year manifests
  - id: normalize
    done_when: outputs/analysis/statements.json holds five aligned years and gaps stay null
  - id: metrics
    done_when: outputs/analysis/kpi_dashboard.json is generated by compute_metrics.py, not hand-filled
  - id: enrich
    done_when: MCP or web captures for industry peers, ownership, litigation, and patents exist under outputs/mcp, or the gap is named
  - id: risks
    done_when: TX-01~TX-10 and OP-01~OP-08 entries are written in evidence-cause-impact form
  - id: charts
    done_when: The standard chart list has at least five charts under outputs/charts, drawn with vivid-figures-skill first
  - id: report
    done_when: outputs/report.md follows the template contract (spine acts, required elements) with continuous chapter numbers
  - id: review
    done_when: the check_report platform tool passes every check on outputs/report.md
deliverables:
  - outputs/report.md
  - outputs/analysis/statements.json
  - outputs/analysis/kpi_dashboard.json
quality_gates:
  - Every figure names an annual-report page, an original source (企查查 / 智慧芽 / 同花顺 with the record such as a penalty number or patent number), or a web URL with access date
  - The report never mentions MCP tool names, server slugs (qcc-*, hithink-*), or internal or temp paths (outputs/, .opencode/, /tmp/, /workspace/) — those stay in the working archive only
  - Subsequent events stay unaudited-labeled and out of the five-year tables
  - Accounting-policy changes mark affected years as not directly comparable
  - No leftover {{placeholders}} and no draft markers (草稿 / 待修改 / TODO) in the report
  - The disclaimer survives at the end of the report
  - Figures number at least the contract minimum, cover every data section, and every table and figure carries a numbered caption with a source line
  - TX/OP risk IDs run continuously from 01 — no gaps, no duplicates
refusal_rules:
  - Do not invent a ticker, 统一社会信用代码, or 案号
  - Do not enable every MCP server for one task
  - Do not present unaudited interim data as audited
  - Do not score risks outside the 56/20/4 mapping
