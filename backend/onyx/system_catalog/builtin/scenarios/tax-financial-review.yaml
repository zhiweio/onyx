domain: tax
objective: Explain statement movement with tied figures and named drivers
required_inputs:
  - entity
  - period
  - currency
  - statements
phases:
  - id: ingest
    done_when: Balance sheet, income statement, and cash flow are in the workspace
  - id: tie
    done_when: Net income, retained earnings, and cash ties are checked
  - id: attribute
    done_when: Each material movement names a line and a business reason
  - id: report
    done_when: outputs/report.docx is filled
deliverables:
  - outputs/report.docx
  - outputs/normalized/ratios.csv
quality_gates:
  - Every ratio shows formula, source line, current value, and compare value
  - Restatements and missing lines are listed under data gaps
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent line items or restate figures
  - Do not hide a broken tie
