domain: tax
objective: Judge how a tax, industry, or region policy change affects the entity
required_inputs:
  - topic
  - jurisdiction
  - as_of_date
phases:
  - id: collect
    done_when: Primary notices and implementing rules are listed with 文号
  - id: status
    done_when: Each item is effective, draft, or repealed
  - id: impact
    done_when: Who is affected and from which date is stated
  - id: report
    done_when: outputs/report.docx is filled
deliverables:
  - outputs/report.docx
quality_gates:
  - Effective status is verified, never assumed
  - Every policy cite has 文号, issuer, and date
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent policy documents or effective dates
  - Do not treat news coverage as the legal text
