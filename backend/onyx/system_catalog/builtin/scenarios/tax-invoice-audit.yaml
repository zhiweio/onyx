domain: tax
objective: Scan invoice files and list exceptions that block deduction
required_inputs:
  - entity
  - period
  - invoice_files
phases:
  - id: ingest
    done_when: PDF and spreadsheet invoices are parsed into a table
  - id: check
    done_when: Required fields, tax IDs, and rates are checked
  - id: report
    done_when: outputs/report.docx lists every exception
deliverables:
  - outputs/report.docx
  - outputs/normalized/invoice_exceptions.csv
quality_gates:
  - Every exception names the file, the field, and the rule
  - Scanned PDFs that fail OCR are listed as data gaps
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent invoice numbers or tax IDs
  - Do not mark a file clean when a required field is missing
