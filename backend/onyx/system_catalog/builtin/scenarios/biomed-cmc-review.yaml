domain: biomed
objective: Grade CMC and quality risk from labels, guidance, and recalls
required_inputs:
  - product
  - market
phases:
  - id: collect
    done_when: Labels, guidance, and recall records are listed
  - id: map
    done_when: Each quality attribute maps to a guideline
  - id: report
    done_when: outputs/report.docx is filled
deliverables:
  - outputs/report.docx
quality_gates:
  - Every risk names the attribute and the source
  - Recalls are dated and linked
  - No leftover {{placeholders}} in the Word file
refusal_rules:
  - Do not invent specification limits
  - Do not treat a draft guidance as a binding requirement
